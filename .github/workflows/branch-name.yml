name: Branch Name Check

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main
   types:
      - opened
      - synchronize
      - reopened

jobs:
  check-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}

          echo "Branch: $BRANCH"

          if [[ ! "$BRANCH" =~ ^feature\/.+$ ]]; then
            echo "Branch name must start with feature/"
            exit 1
          fi